<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYBUDDIES Reset Email</title>
    <link rel="stylesheet" href="./reset-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="left">
        <div>

            <img src="./assets/icon/Logo.png" class="logo" alt="logo">

            <div>
                <img src="./assets/icon/reset-password.jpg" class="mockup" alt="image">
            </div>

            <div class="left-bottom-container">
                <div class="left-bottom">

                    <div>&copy; PAYBUDDIES 2025 </div>

                    <div class="left-bottom-link">
                        <a href="#">Help Center</a>
                        <a href="termsofuse.html">Terms of Service</a>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <div class="right">
        <div>
            <div class="flyover">
                <img src="./assets/icon/Logo.png" class="mobile-logo" alt="logo">
                <!-- <img src="./assets/icon/flyover.png" class="flyover-img" alt="flyover"> -->
            </div>
            <div class="right-top">
                <h2>Reset Password</h2>
                <p>Enter your registered email address to reset your password</p>
            </div>

            <div class="email">
                <label>Email</label>
                <input type="email" id="email" placeholder="johndoe1234@email.com" oninput="validateEmail()">
                <div class="alert" id="emailError"></div>
            </div>

            <div class="right-bottom">
                <button type="button" id="verifyBtn" onclick="proceedBtn()" class="button" disabled>Proceed</button>
                <p class="login">Go back to <span class="resend"><a href="login.html">Login</a></span></p>
            </div>


            <div class=" mobile">
                <div>
                    <p>&copy; PAYBUDDIES 2025</p>
                </div>
                <div>
                    <a href="#">Help Center</a>
                    <a href="termsofuse.html">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

 <script>
        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("emailError");
        const verifyBtn = document.getElementById("verifyBtn");

        function validateEmail() {
            const email = emailInput.value.trim();
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            if (isValid) {
                emailError.textContent = "";
                verifyBtn.disabled = false;
                verifyBtn.style.backgroundColor = "#CC33CC";
            } else {
                emailError.textContent = "Enter a valid email";
                verifyBtn.disabled = true;
                verifyBtn.style.backgroundColor = "";
            }
        }

        function proceedBtn() {
            const email = emailInput.value.trim();
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                window.location.href = "reset-sent.html";
            }
        }
    </script>
</body>

</html>
