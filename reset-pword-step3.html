<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYBUDDIES Reset Password</title>
    <link rel="stylesheet" href="./complete-verify.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="left">
        <div>


            <img src="./assets/icon/Logo.png" class="logo" alt="logo">

            <div>
                <img src="./assets/icon/reset.png" class="mockup" alt="image">
            </div>

            <div class="left-bottom-container">



                <div class="left-bottom">
                    <div>&copy; PAYBUDDIES 2024 </div>

                    <div class="left-bottom-link">
                        <a href="#">Help Center</a>
                        <a href="termsofuse.html">Terms of Service</a>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <div class="right">
        <div>
            <div class="flyover">
                <img src="./assets/icon/Logo.png" class="mobile-logo" alt="logo">
                <!-- <img src="./assets/icon/flyover.png" class="flyover-img" alt="flyover"> -->
            </div>
            <div class="right-top">
                <h2>Reset Password</h2>
                <p>Create a new password</p>
            </div>

            <div class="email">
                <label>Password <span class="asteriks">*</span></label>
                <div class="input-holder">
                    <input type="password" id="password">
                    <img src="./assets/icon/password-reveal.png" alt="icon" class="toggle-password" onclick="togglePassword()">
                </div>
                <label>Confirm password <span class="asteriks">*</span></label>

                <div class="input-holder">
                    <input type="password" id="confirmPassword">
                    <img src="./assets/icon/password-reveal.png" alt="icon" class="confirm-toggle-password" onclick="changePassword()">
                </div>

                <div id="emailError" class="error-message"></div>
            </div>

            <div class="right-bottom">
                <button type="submit" id="verifyBtn" class="button" disabled>Proceed</button>
                <p class="login">Go back to <span class="resend"><a href="login.html">Login</a></span></p>
            </div>

            <div class=" mobile">
                <div>
                    <p>&copy; PAYBUDDIES 2024</p>
                </div>
                <div>
                    <a href="#">Help Center</a>
                    <a href="termsofuse.html">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Eye Toggle on the Password
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const passwordIcon = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                passwordIcon.src = "./assets/icon/password-!reveal.png";
            } else {
                passwordInput.type = "password";
                passwordIcon.src = "./assets/icon/password-reveal.png";
            }
        }


        function changePassword() {
            const confirmPasswordInput = document.getElementById("confirmPassword");
            const confirmPasswordIcon = document.querySelector(".confirm-toggle-password");

            if (confirmPasswordInput.type === "password") {
                confirmPasswordInput.type = "text";
                confirmPasswordIcon.src = "./assets/icon/password-!reveal.png";
            } else {
                confirmPasswordInput.type = "password";
                confirmPasswordIcon.src = "./assets/icon/password-reveal.png";
            }
        }


        function checkInputs() {
            const passwordInput = document.getElementById("password");
            const confirmPasswordInput = document.getElementById("confirmPassword");
            const verifyButton = document.getElementById("verifyBtn");
            const emailError = document.getElementById("emailError");


            if (passwordInput.value.trim() && confirmPasswordInput.value.trim()) {

                if (passwordInput.value === confirmPasswordInput.value) {
                    emailError.textContent = "";
                    verifyButton.style.backgroundColor = "#CC33CC";
                    verifyButton.disabled = false;
                } else {
                    emailError.textContent = "Passwords do not match.";
                    emailError.style.color = "red";
                    verifyButton.style.backgroundColor = "";
                    verifyButton.disabled = true;
                }
            } else {
                emailError.textContent = "";
                verifyButton.style.backgroundColor = "";
                verifyButton.disabled = true;
            }
        }

        function navigateToNextPage() {

            window.location.href = "transfersuccess.html";
        }

        document.getElementById("password").addEventListener("input", checkInputs);
        document.getElementById("confirmPassword").addEventListener("input", checkInputs);
        document.getElementById("verifyBtn").addEventListener("click", navigateToNextPage);
    </script>
</body>

</html>
